[package]
name = "gitwave-desktop"
version = "0.5.0"
description = "GitWave Desktop — repositories as wavetables (cross-platform Windows, macOS, Linux)"
authors = ["Trevor & Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
